name: ExtraChatFork
author: Anna, beerpsi
description: |-
  ExtraChat adds end-to-end encrypted, cross-data-centre, unlimited linkshells
  to the game. (Fork of official plugin with features and some fixes)
changelog: |-
  - Migrate plugin to Dalamud's stock windowing system. This allows plugin windows to respect the Look & Feel option in Dalamud settings.
  - Fix inputs in Keybound Brawler being sent to ExtraChat linkshells if they were the active channel before entering the gamemode.
punchline: 'Cross-data-centre linkshells with unlimited members.'
repo_url: https://github.com/beer-psi/ExtraChat
accepts_feedback: false
